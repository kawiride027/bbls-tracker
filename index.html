<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FF4500">
  <link rel="manifest" href="manifest.json">
  <title>BBLS Tracker Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --red:#FF4500; --red2:#CC3700; --bg:#0a0a0a; --surf:#1a1a1a; --sec:#111;
      --txt:#fff; --dim:#888; --green:#00e676; --warn:#ffaa00; --bad:#ff1744; --bdr:#2a2a2a;
    }
    body { font-family:'Roboto Condensed',sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; padding-bottom:90px; overflow-x:hidden; }
    /* PIN */
    .pin-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }
    .pin-logo { font-family:'Bebas Neue',cursive; font-size:44px; color:var(--red); letter-spacing:4px; }
    .pin-tag { color:var(--dim); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin:6px 0 50px; }
    .pin-lbl { color:var(--dim); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; }
    .pin-dots { display:flex; gap:18px; margin-bottom:50px; }
    .pin-dot { width:18px; height:18px; border-radius:50%; border:2px solid var(--bdr); transition:all 0.2s; }
    .pin-dot.on { background:var(--red); border-color:var(--red); box-shadow:0 0 12px rgba(255,69,0,.5); }
    .pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:280px; }
    .pkey { background:var(--surf); border:1px solid var(--bdr); color:var(--txt); padding:22px; border-radius:14px; font-family:'Bebas Neue',cursive; font-size:30px; cursor:pointer; text-align:center; transition:all .15s; }
    .pkey:active { background:var(--red); transform:scale(.93); }
    .pkey.del { font-size:16px; color:var(--dim); }
    .pin-err { color:var(--bad); font-size:13px; margin-top:20px; animation:shake .3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    /* Layout */
    .hdr { background:linear-gradient(135deg,var(--red),var(--red2)); padding:18px 20px; position:sticky; top:0; z-index:100; box-shadow:0 4px 20px rgba(255,69,0,.3); }
    .hdr-t { font-family:'Bebas Neue',cursive; font-size:26px; letter-spacing:2px; text-align:center; }
    .hdr-s { text-align:center; font-size:12px; opacity:.85; letter-spacing:1px; margin-top:4px; }
    .sbar { display:flex; justify-content:space-around; background:var(--surf); padding:12px; border-bottom:1px solid var(--bdr); }
    .si { text-align:center; cursor:pointer; padding:4px 10px; border-radius:8px; transition:all .2s; }
    .si:active { background:rgba(255,69,0,.1); }
    .sl { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:3px; }
    .sv { font-size:18px; font-weight:bold; color:var(--red); font-family:'Bebas Neue',cursive; }
    .wrap { padding:16px; max-width:600px; margin:0 auto; }
    .card { background:var(--surf); border-radius:14px; padding:18px; margin-bottom:16px; border:1px solid var(--bdr); }
    .ct { font-family:'Bebas Neue',cursive; font-size:22px; color:var(--red); letter-spacing:1px; margin-bottom:16px; text-align:center; }
    /* Exercise */
    .ex-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--bdr); }
    .ex-name { font-family:'Bebas Neue',cursive; font-size:26px; color:var(--red); flex:1; }
    .chk { width:32px; height:32px; border:2px solid var(--bdr); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; transition:all .3s; flex-shrink:0; }
    .chk.done { background:var(--green); border-color:var(--green); color:#000; }
    /* Weight */
    .wbox { background:rgba(255,69,0,.08); border:1.5px solid var(--red); border-radius:10px; padding:14px; margin-bottom:14px; }
    .wlbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
    .wval { font-size:38px; color:var(--red); font-family:'Bebas Neue',cursive; letter-spacing:2px; }
    .wadj { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
    .wb { background:rgba(255,255,255,.06); border:1px solid var(--bdr); color:var(--txt); padding:10px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:13px; transition:all .2s; }
    .wb:active { background:var(--red); border-color:var(--red); transform:scale(.95); }
    .pbox { background:rgba(255,255,255,.04); padding:10px 12px; border-radius:8px; margin-top:10px; border-left:3px solid var(--red); }
    .plbl { font-size:10px; color:var(--dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:1px; }
    .pval { font-size:14px; font-weight:bold; }
    /* Sets */
    .slbl { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
    .sgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
    .sbox { background:var(--sec); border:2px solid var(--bdr); border-radius:10px; padding:14px 8px; text-align:center; transition:all .3s; }
    .sbox.hit { background:rgba(0,230,118,.15); border-color:var(--green); }
    .sbox.miss { background:rgba(255,23,68,.15); border-color:var(--bad); }
    .sn { font-size:10px; color:var(--dim); margin-bottom:6px; text-transform:uppercase; }
    .sinput { width:100%; background:transparent; border:none; color:var(--txt); font-size:32px; font-weight:bold; text-align:center; font-family:'Bebas Neue',cursive; outline:none; }
    .sinput::-webkit-inner-spin-button, .sinput::-webkit-outer-spin-button { -webkit-appearance:none; }
    /* Alert */
    .alrt { border-radius:8px; padding:12px; margin-bottom:14px; font-size:13px; line-height:1.5; }
    .alrt.ok { background:rgba(0,230,118,.15); border:1px solid var(--green); color:var(--green); }
    .alrt.ng { background:rgba(255,23,68,.15); border:1px solid var(--bad); color:var(--bad); }
    .alrt.warn { background:rgba(255,170,0,.15); border:1px solid var(--warn); color:var(--warn); }
    /* Timer */
    .tcard { background:linear-gradient(135deg,var(--red2),var(--red)); border-radius:10px; padding:18px; text-align:center; margin-bottom:14px; }
    .tdisp { font-size:54px; font-family:'Bebas Neue',cursive; letter-spacing:3px; margin-bottom:10px; }
    .tdisp.tick { animation:pulse 1s ease-in-out infinite; }
    .tdisp.neg { color:#ffaa00; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
    .tpre { display:flex; gap:8px; justify-content:center; margin-bottom:10px; }
    .tpb { background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.3); color:#fff; padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:12px; letter-spacing:1px; transition:all .2s; }
    .tpb.on { background:rgba(255,255,255,.35); border-color:#fff; }
    .tpb:active { transform:scale(.95); }
    .tctrls { display:flex; gap:10px; justify-content:center; }
    .tb { background:rgba(255,255,255,.15); border:1.5px solid rgba(255,255,255,.3); color:#fff; padding:10px 24px; border-radius:8px; cursor:pointer; font-weight:bold; font-size:13px; transition:all .2s; }
    .tb:active { background:rgba(255,255,255,.3); transform:scale(.95); }
    /* Notes */
    .ntxt { width:100%; background:var(--sec); border:1px solid var(--bdr); border-radius:8px; padding:12px; color:var(--txt); font-family:'Roboto Condensed',sans-serif; font-size:14px; resize:none; min-height:60px; }
    .ntxt:focus { outline:none; border-color:var(--red); }
    /* Nav */
    .navb { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--surf); border-top:1px solid var(--bdr); box-shadow:0 -4px 20px rgba(0,0,0,.5); }
    .nb { flex:1; padding:16px 4px; background:var(--sec); border:none; color:var(--txt); font-size:12px; font-weight:bold; cursor:pointer; text-transform:uppercase; letter-spacing:1px; transition:all .2s; font-family:'Roboto Condensed',sans-serif; }
    .nb:active { background:var(--red); }
    .nb.pr { background:var(--red); }
    .nb.pr:active { background:var(--red2); }
    .nb.dng { background:rgba(255,23,68,.15); color:var(--bad); }
    .nb.dng:active { background:var(--bad); color:#fff; }
    .nb:disabled { opacity:.3; cursor:not-allowed; }
    /* Modal */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200; align-items:center; justify-content:center; padding:20px; }
    .modal.open { display:flex; }
    .mbox { background:var(--surf); border-radius:16px; padding:24px; max-width:500px; width:100%; border:1px solid var(--bdr); max-height:90vh; overflow-y:auto; }
    .mt { font-family:'Bebas Neue',cursive; font-size:24px; color:var(--red); text-align:center; letter-spacing:2px; margin-bottom:20px; }
    .btn { width:100%; padding:14px; border-radius:10px; cursor:pointer; font-weight:bold; font-size:14px; letter-spacing:1px; text-transform:uppercase; transition:all .2s; border:none; font-family:'Roboto Condensed',sans-serif; margin-bottom:10px; }
    .btn:active { transform:scale(.97); }
    .bpr { background:var(--red); color:#fff; }
    .bsc { background:var(--sec); color:var(--txt); border:1px solid var(--bdr); }
    .bdn { background:rgba(255,23,68,.15); color:var(--bad); border:1px solid var(--bad); }
    .bok { background:var(--green); color:#000; }
    .bsc:active { background:var(--bdr); }
    .bdn:active { background:var(--bad); color:#fff; }
    /* History */
    .hi { background:var(--sec); border-radius:10px; padding:14px; margin-bottom:10px; border-left:3px solid var(--red); display:flex; justify-content:space-between; align-items:flex-start; }
    .ht { font-weight:bold; color:var(--red); font-size:14px; margin-bottom:4px; }
    .hm { font-size:12px; color:var(--dim); }
    .delbtn { background:none; border:none; color:var(--bad); font-size:22px; cursor:pointer; padding:0 4px; }
    .delbtn:active { transform:scale(1.2); }
    /* Summary */
    .sumex { background:var(--sec); border-radius:10px; padding:14px; margin-bottom:10px; }
    .sumname { font-weight:bold; color:var(--red); margin-bottom:8px; }
    .sumsets { display:flex; gap:6px; flex-wrap:wrap; }
    .stag { padding:4px 10px; border-radius:6px; font-size:13px; font-weight:bold; }
    .stag.ok { background:rgba(0,230,118,.2); color:var(--green); }
    .stag.ng { background:rgba(255,23,68,.2); color:var(--bad); }
    .stag.mt { background:rgba(255,255,255,.06); color:var(--dim); }
    .sugg { margin-top:8px; font-size:12px; }
    .sugg.up { color:var(--green); }
    .sugg.dn { color:var(--bad); }
    /* Day grid */
    .daybtn { background:var(--sec); border:1px solid var(--bdr); color:var(--txt); padding:16px; border-radius:10px; cursor:pointer; width:100%; margin-bottom:10px; text-align:left; font-family:'Roboto Condensed',sans-serif; font-size:15px; font-weight:bold; transition:all .2s; display:flex; justify-content:space-between; align-items:center; }
    .daybtn:active { background:var(--red); border-color:var(--red); }
    .dtag { font-size:11px; color:var(--dim); font-weight:normal; }
    .donetag { font-size:11px; color:var(--green); font-weight:bold; }
    /* Week picker */
    .wkbtn { background:var(--sec); border:1px solid var(--bdr); color:var(--txt); padding:14px; border-radius:10px; cursor:pointer; width:100%; margin-bottom:10px; text-align:left; font-family:'Roboto Condensed',sans-serif; font-size:14px; transition:all .2s; }
    .wkbtn.sel { background:var(--red); border-color:var(--red); color:#fff; }
    .wkbtn:active { background:var(--red); }
    /* Quote banner */
    .quote-banner { background:linear-gradient(135deg,rgba(255,69,0,.15),rgba(255,69,0,.05)); border:1px solid rgba(255,69,0,.3); border-radius:10px; padding:14px 16px; margin-bottom:14px; position:relative; cursor:pointer; }
    .quote-text { font-style:italic; font-size:14px; color:var(--txt); line-height:1.5; }
    .quote-author { font-size:11px; color:var(--dim); margin-top:6px; text-align:right; }
    .quote-dismiss { position:absolute; top:8px; right:10px; color:var(--dim); font-size:14px; }
    /* Confetti overlay */
    .confetti-overlay { position:fixed; inset:0; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,.85); }
    .confetti-emoji { font-size:80px; animation:bounceIn .5s ease-out; }
    .confetti-text { font-family:'Bebas Neue',cursive; font-size:36px; color:var(--red); letter-spacing:3px; margin-top:16px; animation:bounceIn .5s ease-out .2s both; }
    .confetti-sub { color:var(--dim); font-size:14px; margin-top:8px; animation:bounceIn .5s ease-out .4s both; }
    @keyframes bounceIn { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
    /* Toast */
    .toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:var(--surf); border:1px solid var(--bdr); border-radius:10px; padding:10px 20px; font-size:13px; z-index:300; animation:fadeIn .3s; }
    .toast.ok { border-color:var(--green); color:var(--green); }
    .toast.err { border-color:var(--bad); color:var(--bad); }
    @keyframes fadeIn { from{opacity:0;transform:translateX(-50%) translateY(-10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    /* Progress summary */
    .prog-week { background:var(--sec); border-radius:10px; margin-bottom:10px; border:1px solid var(--bdr); overflow:hidden; }
    .prog-week-hdr { padding:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
    .prog-week-hdr:active { background:rgba(255,69,0,.1); }
    .prog-week-title { font-family:'Bebas Neue',cursive; font-size:18px; color:var(--red); }
    .prog-week-meta { font-size:11px; color:var(--dim); }
    .prog-week-body { padding:0 14px 14px; display:none; }
    .prog-week-body.open { display:block; }
    .prog-day { margin-bottom:10px; }
    .prog-day-title { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid var(--bdr); }
    .prog-ex { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
    .prog-ex-name { font-size:13px; color:var(--txt); }
    .prog-ex-sets { display:flex; gap:4px; }
    .prog-pill { padding:2px 6px; border-radius:4px; font-size:11px; font-weight:bold; }
    .prog-pill.ok { background:rgba(0,230,118,.2); color:var(--green); }
    .prog-pill.ng { background:rgba(255,23,68,.2); color:var(--bad); }
    .prog-pill.mt { background:rgba(255,255,255,.06); color:var(--dim); }
    /* Settings */
    .setting-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--bdr); }
    .setting-lbl { font-size:13px; color:var(--txt); }
    .setting-input { background:var(--sec); border:1px solid var(--bdr); border-radius:8px; padding:8px 12px; color:var(--txt); font-size:13px; width:100%; font-family:'Roboto Condensed',sans-serif; }
    .setting-input:focus { outline:none; border-color:var(--red); }
    /* Progression prompts */
    .prog-prompt { background:var(--sec); border-radius:10px; padding:14px; margin-bottom:12px; }
    .prog-prompt.up { border-left:3px solid var(--green); }
    .prog-prompt.dn { border-left:3px solid var(--warn); }
    .prog-prompt-name { font-weight:bold; font-size:14px; color:var(--red); margin-bottom:2px; }
    .prog-prompt-info { font-size:12px; color:var(--dim); margin-bottom:10px; line-height:1.4; }
    .prog-prompt-btns { display:flex; gap:8px; flex-wrap:wrap; }
    .prog-prompt-btn { padding:8px 14px; border-radius:8px; border:1px solid var(--bdr); background:var(--sec); color:var(--txt); font-size:13px; font-weight:bold; cursor:pointer; transition:all .2s; font-family:'Roboto Condensed',sans-serif; }
    .prog-prompt-btn:active { transform:scale(.95); }
    .prog-prompt-btn.sel { background:var(--red); border-color:var(--red); color:#fff; }
    .prog-prompt-btn.keep.sel { background:var(--dim); border-color:var(--dim); color:#000; }
    /* Confetti canvas */
    #confetti-canvas { position:fixed; inset:0; z-index:998; pointer-events:none; }
  </style>
</head>
<body>
<div id="root"></div>
<canvas id="confetti-canvas"></canvas>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;
// ── Utilities ──────────────────────────────────────────────────
function calcPlates(total, bar) {
  const per = (total - bar) / 2;
  let rem = per; const out = [];
  for (const p of [55,45,35,25,10,5,2.5]) {
    const n = Math.floor(rem/p + 0.001);
    if (n>0) { out.push(`${n}\u00d7${p%1?p:Math.floor(p)}`); rem=Math.round((rem-n*p)*10)/10; }
  }
  return out.length ? out.join(', ') : 'Bar only';
}
function calcPlatesCustom(total, bar, availablePlates, showPerSide) {
  const perSide = (total - bar) / 2;
  let rem = perSide;
  const out = [];
  
  for (const p of availablePlates) {
    const n = Math.floor(rem/p + 0.001);
    if (n > 0) {
      out.push(`${n}\u00d7${p%1?p:Math.floor(p)}`);
      rem = Math.round((rem - n*p)*10)/10;
    }
  }
  
  if (showPerSide) {
    return out.length ? out.join(', ') + ' per side' : 'No plates needed';
  }
  return out.length ? out.join(', ') : 'Bar only';
}
function calcPlatesForExercise(exerciseName, total, bar) {
  // Leg Press: no bar, plates per side, no 55s
  if (exerciseName === "Leg Press") {
    const perSide = total / 2;
    return calcPlatesCustom(perSide, 0, [45,35,25,10,5,2.5], true);
  }
  
  // Seated Calf Raise: no bar, plates per side, no 55s
  if (exerciseName === "Seated Calf Raise") {
    const perSide = total / 2;
    return calcPlatesCustom(perSide, 0, [45,35,25,10,5,2.5], true);
  }
  
  // Bench variations: 45lb bar, no 55s
  if (exerciseName === "Bench Press" || exerciseName === "Incline Bench" || exerciseName === "Close Grip Bench") {
    return calcPlatesCustom(total, bar, [45,35,25,10,5,2.5], false);
  }
  
  // Default: standard barbell with all plates
  return calcPlates(total, bar);
}
// Epley formula
function calcRM(w, r) { return r > 0 ? Math.round(w * (1 + 0.0333 * r)) : null; }
function roundTo5(n) { return Math.round(n / 5) * 5; }
// ── 16-Week Macrocycle Pattern ─────────────────────────────────
const CYCLE_PATTERN = [
  // Meso 1
  { pct:0.70, reps:10, sets:4, accReps:"10-12", accMin:10, accMax:12, accSets:4, deload:false, test:false, meso:1, label:"Meso 1 Wk 1", rest:300 },
  { pct:0.75, reps:8,  sets:4, accReps:"10-12", accMin:10, accMax:12, accSets:4, deload:false, test:false, meso:1, label:"Meso 1 Wk 2", rest:300 },
  { pct:0.80, reps:6,  sets:4, accReps:"10-12", accMin:10, accMax:12, accSets:4, deload:false, test:false, meso:1, label:"Meso 1 Wk 3", rest:300 },
  { pct:0.80, reps:3,  sets:2, accReps:6,       accMin:6,  accMax:6,  accSets:2, deload:true,  test:false, meso:1, label:"Meso 1 Deload", rest:300 },
  // Meso 2
  { pct:0.75, reps:8,  sets:4, accReps:"8-10",  accMin:8,  accMax:10, accSets:4, deload:false, test:false, meso:2, label:"Meso 2 Wk 1", rest:300 },
  { pct:0.80, reps:6,  sets:4, accReps:"8-10",  accMin:8,  accMax:10, accSets:4, deload:false, test:false, meso:2, label:"Meso 2 Wk 2", rest:300 },
  { pct:0.85, reps:4,  sets:4, accReps:"8-10",  accMin:8,  accMax:10, accSets:4, deload:false, test:false, meso:2, label:"Meso 2 Wk 3", rest:300 },
  { pct:0.85, reps:2,  sets:2, accReps:5,       accMin:5,  accMax:5,  accSets:2, deload:true,  test:false, meso:2, label:"Meso 2 Deload", rest:300 },
  // Meso 3
  { pct:0.80, reps:6,  sets:4, accReps:"8-10",  accMin:8,  accMax:10, accSets:4, deload:false, test:false, meso:3, label:"Meso 3 Wk 1", rest:300 },

// ── Confetti Engine ────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#FF4500','#00e676','#ffaa00','#ff1744','#2196F3','#E040FB','#FF6D00','#76FF03'];
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * -1,
      w: Math.random() * 10 + 5,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * 4 + 2,
      rot: Math.random() * 360,
      rv: (Math.random() - 0.5) * 10,
      opacity: 1,
    });
  }
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.opacity <= 0) return;
      alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.1;
      p.rot += p.rv;
      if (frame > 60) p.opacity -= 0.015;
    });
    frame++;
    if (alive && frame < 180) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}
// ── Audio Beep ─────────────────────────────────────────────────
let audioCtx = null;
function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 800;
    gain.gain.value = 0.3;
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  } catch(e) {}
  try { navigator.vibrate([200, 100, 200]); } catch(e) {}
}

async function syncToSheets(workout) {
  const url = localStorage.getItem('sheetsUrl');
  if (!url) return null;
  const rows = workout.ex.map(e => ({
    date: new Date(workout.date).toLocaleDateString('en-US'),
    week: workout.week,
    day: workout.day,
    exercise: e.name,
    weight: e.cw,
    set1: e.sets[0] ?? '',
    set2: e.sets[1] ?? '',
    set3: e.sets[2] ?? '',
    set4: e.sets[3] ?? '',
    notes: e.notes || '',
  }));
  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ rows }),
    });
    const data = await resp.json();
    return data.status === 'ok';
  } catch(e) {
    return false;
  }
}

// ── Cycle Generation ───────────────────────────────────────────
function generateCycle(startWeek, oneRMs, accW) {
  const cycleNum = Math.max(1, Math.ceil((startWeek - 14) / 16));
  const weeks = {};
  CYCLE_PATTERN.forEach((pat, idx) => {
    const wn = startWeek + idx;
    const pctLabel = pat.test ? "95% AMRAP" : `${Math.round(pat.pct*100)}%`;
    let cycleLabel;
    if (pat.test) cycleLabel = "Strength Test Week";
    else if (pat.deload && pat.meso===4) cycleLabel = `Cycle ${cycleNum} \u00b7 Full Deload`;
    else cycleLabel = `Cycle ${cycleNum} \u00b7 Meso ${pat.meso}${pat.deload?' Deload':''}`;
    const primNote = pat.test ? "Go to failure + back-off" : `${pat.reps} reps \u00b7 ${pat.sets} sets`;
    const accNote = `Acc: ${pat.accReps} reps${pat.test?'':' \u00b7 '+pat.accSets+' sets'}`;
    const noteStr = primNote + " \u00b7 " + accNote;
    const nextPat = CYCLE_PATTERN[idx+1];
    const nextLabel = nextPat
      ? `Week ${wn+1}: ${nextPat.label} (${Math.round(nextPat.pct*100)}%)`
      : `Week ${wn+1}: Next Cycle begins`;
    const days = {};
    DAY_TEMPLATES.forEach((tmpl, di) => {
      const dayNum = di + 1;
      let dayTitle = tmpl.title;
      if (pat.test) {
        const base = tmpl.title.split("&")[0].trim();
        dayTitle = base + " Test" + (dayNum===5?" 2":"");
      }
      const exercises = tmpl.ex.map((et, exi) => {
        const rmKey = et.rmKey || et.name;
        const ex = { id: di*10+exi+1, name: et.name };
        if (et.prim) {
          const oneRM = oneRMs[rmKey] || 0;
          ex.w = roundTo5(oneRM * pat.pct);
          if (et.bar !== null) ex.bar = et.bar;
          ex.prim = true;
          if (pat.test && !NO_TEST.has(et.name)) {
            ex.sets = pat.sets;
            ex.reps = "AMRAP";
            ex.test = true;
            ex.rm = oneRM;
            ex.backoffW = roundTo5(oneRM * 0.85);
            ex.backoffReps = 4;
            if (et.rmKey) ex.rmKey = et.rmKey;
          } else {
            ex.sets = pat.sets;
            ex.reps = pat.reps;
          }
        } else {
          // Accessory: use rep-range-specific weight
          const accKey = et.name + " " + pat.accReps;
          ex.w = et.bw ? "BW" : (accW[accKey] || accW[et.name] || 0);
          ex.sets = pat.accSets;
          ex.reps = pat.accReps;
          ex.prim = false;
        }
        return ex;
      });
      days[dayNum] = { title: dayTitle, ex: exercises };
    });
    weeks[wn] = {
      label: `Week ${wn} \u2014 ${pat.label}`,
      cycle: cycleLabel,
      intensity: pctLabel,
      note: noteStr,
      next: nextLabel,
      rP: pat.rest,
      rA: 120,
      isDeload: pat.deload,
      isTest: pat.test,
      days: days,
    };
  });
  return weeks;
}

function PinScreen({ onUnlock }) {
  const [pin, setPin] = useState('');
  const [confirm, setConfirm] = useState('');
  const [step, setStep] = useState('enter');
  const [err, setErr] = useState('');
  const setup = !localStorage.getItem('userPin');
  const press = d => {
    if (pin.length >= 4) return;
    const np = pin + d; setPin(np); setErr('');
    if (np.length === 4) setTimeout(() => {
      if (setup) {
        if (step==='enter') { setConfirm(np); setPin(''); setStep('confirm'); }
        else if (np===confirm) { localStorage.setItem('userPin', np); onUnlock(); }
        else { setErr("PINs don't match. Try again."); setPin(''); setStep('enter'); setConfirm(''); }
      } else {
        if (np === localStorage.getItem('userPin')) onUnlock();
        else { setErr('Wrong PIN. Try again.'); setPin(''); }
      }
    }, 120);
  };
  return (
    <div className="pin-screen">
      <div className="pin-logo">BBLS</div>
      <div className="pin-tag">Workout Tracker Pro</div>
      <div className="pin-lbl">
        {setup ? (step==='enter' ? 'Create your PIN' : 'Confirm your PIN') : 'Enter PIN to unlock'}
      </div>
      <div className="pin-dots">
        {[0,1,2,3].map(i=><div key={i} className={`pin-dot${pin.length>i?' on':''}`}/>)}
      </div>
      <div className="pin-pad">
        {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} className="pkey" onClick={()=>press(String(n))}>{n}</button>)}
        <div/>
        <button className="pkey" onClick={()=>press('0')}>0</button>
        <button className="pkey del" onClick={()=>{setPin(p=>p.slice(0,-1));setErr('');}}>&#9003;</button>
      </div>
      {err && <div className="pin-err">{err}</div>}
    </div>
  );
}

          <button className="btn bok" onClick={saveWorkout}>{'\u2713'} Save Workout</button>
          <button className="btn bsc" onClick={()=>setModal(null)}>{'\u2190'} Keep Editing</button>
          <button className="btn bdn" onClick={abandon}>{'\u2715'} Discard Without Saving</button>
        </div>
      </div>
    );
  }
  // ── Home / Day Selector ───────────────────────────────────────
  if(!workout){
    const weekKeys = Object.keys(allWeeks).map(Number).sort((a,b)=>a-b);
    const last4 = getLast4Weeks();
    return(
      <div>
        <div className="hdr">
          <div className="hdr-t">BBLS Tracker Pro</div>
          <div className="hdr-s">{wd.cycle} &middot; {wd.note}</div>
        </div>
        <div className="sbar">
          <div className="si" onClick={()=>setModal('week')}><div className="sl">Week</div><div className="sv">{week}</div></div>
          <div className="si" onClick={()=>setModal('dash')}><div className="sl">Intensity</div><div className="sv">{wd.intensity}</div></div>
          <div className="si" onClick={()=>setModal('progress')}><div className="sl">Progress</div><div className="sv">{'\uD83D\uDCCA'}</div></div>
          <div className="si" onClick={()=>setModal('hist')}><div className="sl">Saved</div><div className="sv">{history.length}</div></div>
        </div>
        <div className="wrap">
          <div className="card">
            <div className="ct">Select Today's Workout</div>
            {Object.entries(wd.days).map(([d,data])=>{
              const done=doneDays.includes(parseInt(d));
              return(
                <button key={d} className="daybtn" onClick={()=>handleDayClick(parseInt(d))}>
                  <div>
                    <div style={{fontFamily:"'Bebas Neue',cursive",fontSize:18,letterSpacing:1}}>
                      Day {d}: {data.title}
                    </div>
                    <div style={{fontSize:11,color:'var(--dim)',marginTop:2}}>
                      {data.ex.length} exercises &middot; {wd.note}
                    </div>
                  </div>
                  {done&&<span className="donetag">{'\u2713'} Done</span>}
                </button>
              );
            })}
          </div>
          <div className="card">
            <div className="ct">This Week</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8}}>
              {[1,2,3,4,5].map(d=>{
                const done=doneDays.includes(d);
                return(
                  <div key={d} style={{background:done?'rgba(0,230,118,.15)':'var(--sec)',border:`1px solid ${done?'var(--green)':'var(--bdr)'}`,borderRadius:8,padding:'10px 4px',textAlign:'center'}}>
                    <div style={{fontSize:10,color:'var(--dim)',marginBottom:4}}>D{d}</div>
                    <div style={{fontSize:18,color:done?'var(--green)':'var(--dim)'}}>{done?'\u2713':'\u25CB'}</div>
                  </div>
                );
              })}
            </div>
          </div>
          {/* Cycle generation prompt */}
          {cycles.length === 0 && Object.keys(saved1RMs).length > 0 && (
            <div className="card">
              <div className="ct">New 1RMs Recorded</div>
              {Object.entries(saved1RMs).map(([name, rm]) => (
                <div key={name} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--bdr)'}}>
                  <span style={{fontSize:13}}>{name}</span>
                  <span style={{color:'var(--green)',fontWeight:'bold',fontSize:13}}>{rm} lbs</span>
                </div>
              ))}
              {Object.keys(saved1RMs).length >= 6 ? (
                <button className="btn bpr" style={{marginTop:10,width:'100%'}} onClick={()=>{
                  setCycles([{ startWeek:30, oneRMs:{...saved1RMs}, accWeights:{...accWeights} }]);
                  setWeek(30);
                  setToast({ msg:'Cycle generated! Weeks 30-45 ready.', type:'ok' });
                }}>{'\uD83D\uDD04'} Generate Weeks 30-45</button>
              ) : (
                <div style={{color:'var(--dim)',fontSize:12,marginTop:10,textAlign:'center'}}>
                  {Object.keys(saved1RMs).length}/6+ primary exercises recorded. Complete strength test to generate next cycle.
                </div>
              )}
            </div>
          )}
          {/* Current 1RMs card */}
          {Object.keys(saved1RMs).length > 0 && cycles.length > 0 && (
            <div className="card">
              <div className="ct">Current 1RMs</div>
              {Object.entries(saved1RMs).map(([name, rm]) => (
                <div key={name} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--bdr)'}}>
                  <span style={{fontSize:13}}>{name}</span>
                  <span style={{color:'var(--red)',fontWeight:'bold',fontSize:13}}>{rm} lbs</span>
                </div>
              ))}
            </div>
          )}
          {/* Accessory Weights card */}
          {cycles.length > 0 && (
            <div className="card">
              <div className="ct">Accessory Weights</div>
              {Object.entries(accWeights).map(([name, w]) => (
                <div key={name} className="setting-row">
                  <span className="setting-lbl">{name}</span>
                  <input className="setting-input" style={{width:80,textAlign:'right'}}
                    type={typeof w==='number'?'number':'text'} value={w}
                    onChange={e=>{
                      const val = e.target.value==='BW'?'BW': (parseFloat(e.target.value)||0);
                      setAccWeights(prev=>({...prev,[name]:val}));
                    }} />
                </div>
              ))}
              <div style={{color:'var(--dim)',fontSize:11,marginTop:8,textAlign:'center'}}>Changes here update future generated cycles</div>
            </div>
          )}
          {/* Settings card */}
          <div className="card">
            <div className="ct">Settings</div>
            <div style={{marginBottom:10}}>
              <div className="wlbl">Google Sheets Sync URL</div>
              <input className="setting-input" type="url" placeholder="Paste your Apps Script web app URL" value={sheetsUrl} onChange={e=>setSheetsUrl(e.target.value)} />
            </div>
            {sheetsUrl && (
              <button className="btn bsc" style={{marginBottom:0}} onClick={async ()=>{
                setToast({msg:'Testing connection...',type:''});
                try {
                  const resp = await fetch(sheetsUrl, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({rows:[{date:'test',week:0,day:0,exercise:'Connection Test',weight:0,set1:'',set2:'',set3:'',set4:'',notes:'test'}]}) });
                  const data = await resp.json();
                  setToast(data.status==='ok'?{msg:'\u2713 Connected!',type:'ok'}:{msg:'\u2717 Failed',type:'err'});
                } catch(e) { setToast({msg:'\u2717 Connection failed',type:'err'}); }
              }}>Test Connection</button>
            )}
            <div style={{borderTop:'1px solid var(--bdr)',marginTop:16,paddingTop:16}}>
              <div className="wlbl" style={{marginBottom:10}}>Backup &amp; Restore</div>
              <div style={{display:'flex',gap:10}}>
                <button className="btn bpr" style={{flex:1,marginBottom:0}} onClick={exportBackup}>{'\u2B07'} Export Backup</button>
                <button className="btn bsc" style={{flex:1,marginBottom:0}} onClick={importBackup}>{'\u2B06'} Import Backup</button>
              </div>
              <div style={{color:'var(--dim)',fontSize:11,marginTop:8,textAlign:'center'}}>
                Export saves all data (workouts, weights, cycles, settings) as a JSON file
              </div>
            </div>
          </div>
        </div>
        {/* Toast */}
        {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}
        {/* Week Selector */}
        <div className={`modal${modal==='week'?' open':''}`}>
          <div className="mbox">
            <div className="mt">Select Week</div>
            <div style={{maxHeight:'70vh',overflowY:'auto'}}>
              <div style={{fontSize:11,color:'var(--dim)',padding:'8px 0',textTransform:'uppercase',letterSpacing:1}}>Current Progress</div>
              {[28,29].filter(w=>allWeeks[w]).map(w=>(
                <button key={w} className={`wkbtn${week===w?' sel':''}`} onClick={()=>{setWeek(w);setModal(null);}}>
                  <strong>{allWeeks[w].label}</strong>
                  <div style={{fontSize:11,marginTop:3,opacity:.7}}>{allWeeks[w].note}</div>
                </button>
              ))}
              {cycles.map((c,ci)=>(
                <div key={ci}>
                  <div style={{fontSize:11,color:'var(--dim)',padding:'8px 0',textTransform:'uppercase',letterSpacing:1}}>
                    Cycle {ci+1} (Weeks {c.startWeek}-{c.startWeek+15})
                  </div>
                  {Array.from({length:16},(_,i)=>c.startWeek+i).filter(w=>allWeeks[w]).map(w=>(
                    <button key={w} className={`wkbtn${week===w?' sel':''}`} onClick={()=>{setWeek(w);setModal(null);}}>
                      <strong>{allWeeks[w].label}</strong>
                      <div style={{fontSize:11,marginTop:3,opacity:.7}}>{allWeeks[w].note}</div>
                    </button>
                  ))}
                </div>
              ))}
            </div>
            <button className="btn bsc" onClick={()=>setModal(null)}>Cancel</button>
          </div>
        </div>
        {/* Dashboard */}
        <div className={`modal${modal==='dash'?' open':''}`}>
          <div className="mbox">
            <div className="mt">Program Dashboard</div>
            {[['Current Week',`Week ${week}`],['Cycle',wd.cycle],['Intensity',wd.intensity],['Protocol',wd.note],['Next Week',wd.next],['Done This Week',`${doneDays.length} / 5`],['Total Saved',`${history.length}`],['Cycles Generated',`${cycles.length}`]].map(([l,v])=>(
              <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'12px 0',borderBottom:'1px solid var(--bdr)'}}>
                <span style={{color:'var(--dim)',fontSize:13}}>{l}</span>
                <span style={{color:'var(--red)',fontWeight:'bold',fontSize:13}}>{v}</span>
              </div>
            ))}
            <button className="btn bsc" style={{marginTop:20}} onClick={()=>setModal(null)}>Close</button>
          </div>
        </div>
        {/* Progress / Last 4 Weeks */}
        <div className={`modal${modal==='progress'?' open':''}`}>
          <div className="mbox">
            <div className="mt">Progress - Last 4 Weeks</div>
            {last4.length === 0
              ? <div style={{textAlign:'center',padding:20,color:'var(--dim)'}}>No workout history yet. Start logging!</div>
              : last4.map(([wk, workouts]) => {
                  const isOpen = expandedWeeks[wk];
                  const daysDone = [...new Set(workouts.map(w=>w.day))].length;
                  const dates = workouts.map(w=>new Date(w.date));
                  const minD = new Date(Math.min(...dates));
                  const maxD = new Date(Math.max(...dates));
                  const range = minD.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' - ' + maxD.toLocaleDateString('en-US',{month:'short',day:'numeric'});
                  return (
                    <div key={wk} className="prog-week">
                      <div className="prog-week-hdr" onClick={()=>setExpandedWeeks(prev=>({...prev,[wk]:!prev[wk]}))}>
                        <div>
                          <div className="prog-week-title">Week {wk}</div>
                          <div className="prog-week-meta">{range} &middot; {daysDone}/5 days</div>
                        </div>
                        <span style={{color:'var(--dim)',fontSize:18}}>{isOpen ? '\u25B2' : '\u25BC'}</span>
                      </div>
                      <div className={`prog-week-body${isOpen?' open':''}`}>
                        {workouts.sort((a,b)=>a.day-b.day).map((wo, wi) => (
                          <div key={wi} className="prog-day">
                            <div className="prog-day-title">Day {wo.day}: {wo.title}</div>
                            {wo.ex.map((e, exi) => {
                              let tgtMin, tgtMax;
                              if (typeof e.reps === 'string' && e.reps.includes('-')) {
                                const parts = e.reps.split('-');
                                tgtMin = parseInt(parts[0]);
                                tgtMax = parseInt(parts[1]);
                              } else {
                                tgtMin = tgtMax = typeof e.reps === 'number' ? e.reps : 6;
                              }
                              return (
                                <div key={exi} className="prog-ex">
                                  <div className="prog-ex-name">{e.name} ({e.cw}lbs)</div>
                                  <div className="prog-ex-sets">
                                    {e.sets.map((s,si) => (
                                      <span key={si} className={`prog-pill ${s===null?'mt':(s>=tgtMin&&s<=tgtMax)?'ok':'ng'}`}>
                                        {s === null ? '–' : s}
                                      </span>
                                    ))}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })
            }
            <button className="btn bsc" style={{marginTop:10}} onClick={()=>setModal(null)}>Close</button>
          </div>
        </div>
        {/* History */}
        <div className={`modal${modal==='hist'?' open':''}`}>
          <div className="mbox">
            <div className="mt">Workout History</div>
            {!history.length
              ? <div style={{textAlign:'center',padding:20,color:'var(--dim)'}}>No workouts saved yet</div>
              : <div style={{maxHeight:400,overflowY:'auto'}}>
                  {history.slice().reverse().map((h,ri)=>{
                    const i=history.length-1-ri;
                    return(
                      <div key={i} className="hi">
                        <div style={{flex:1}}>
                          <div className="ht">Week {h.week} Day {h.day}: {h.title}</div>
                          <div className="hm">{new Date(h.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} &middot; {h.ex.length} exercises</div>
                        </div>
                        <button className="delbtn" onClick={()=>delHist(i)}>{'\uD83D\uDDD1'}</button>
                      </div>
                    );
                  })}
                </div>
            }
            {history.length>0&&(
              <>
                <button className="btn bpr" style={{marginTop:10}} onClick={exportCSV}>{'\uD83D\uDCCA'} Export to CSV</button>
                {sheetsUrl && <button className="btn bsc" onClick={async ()=>{
                  setToast({msg:'Syncing all workouts...',type:''});
                  let ok = true;
                  for (const w of history) {
                    const res = await syncToSheets(w);
                    if (res === false) { ok = false; break; }
                  }
                  setToast(ok ? {msg:'\u2713 All synced!',type:'ok'} : {msg:'\u2717 Sync failed',type:'err'});
                }}>Sync All to Sheets</button>}
              </>
            )}
            <button className="btn bsc" onClick={()=>setModal(null)}>Close</button>
          </div>
        </div>
      </div>
    );
  }
  // ── Active Workout ─────────────────────────────────────────────
  let tgtMin, tgtMax;
  if (typeof ex.reps === 'string' && ex.reps.includes('-')) {
    const parts = ex.reps.split('-');
    tgtMin = parseInt(parts[0]);
    tgtMax = parseInt(parts[1]);
  } else {
    tgtMin = tgtMax = typeof ex.reps === 'number' ? ex.reps : 6;
  }
  
  const fails=ex.sets.filter(s=>s!==null&&(s<tgtMin||s>tgtMax)).length;
  const total=workout.ex.reduce((a,e)=>a+e.sets.filter(s=>s!==null).length,0);
  const poss=workout.ex.reduce((a,e)=>a+e.sets.length,0);
  
  const ticking = timerEndTime !== null;
  return(
    <div>
      <div className="hdr">
        <div className="hdr-t">Wk{workout.week} D{workout.day}: {workout.title}</div>
        <div className="hdr-s">{wd.cycle} &middot; {wd.intensity}</div>
      </div>
      <div className="sbar">
        <div className="si"><div className="sl">Exercise</div><div className="sv">{ei+1}/{workout.ex.length}</div></div>
        <div className="si"><div className="sl">Sets Done</div><div className="sv">{total}/{poss}</div></div>
        <div className="si"><div className="sl">Checked</div><div className="sv">{workout.ex.filter(e=>e.done).length}/{workout.ex.length}</div></div>
      </div>
      <div className="wrap">
        {/* Motivational Quote */}
        {showQuote && ei === 0 && (
          <div className="quote-banner" onClick={()=>setShowQuote(false)}>
            <div className="quote-dismiss">{'\u2715'}</div>
            <div className="quote-text">"{quote.text}"</div>
            <div className="quote-author">&mdash; {quote.author}</div>
          </div>
        )}
        <div className="card">
          <div className="ex-hdr">
            <div className="ex-name">{ex.name}</div>
            <div className={`chk${ex.done?' done':''}`} onClick={togDone}>{ex.done?'\u2713':''}</div>
          </div>
          {ex.test&&ex.sets[0]!=null&&<div className="alrt ok">{'\uD83C\uDFAF'} Est. New 1RM: <strong>{calcRM(ex.cw,ex.sets[0])} lbs</strong> (Epley)<div style={{fontSize:11,marginTop:4,opacity:.8}}>{ex.sets[0]} reps @ {ex.cw} lbs</div></div>}
          {!ex.test&&!wd.isDeload&&!wd.isTest&&fails>=3&&ex.prim&&<div className="alrt ng">{'\u26A0\uFE0F'} Missed target 3+ sets &mdash; consider -10 lbs next week</div>}
          {!wd.isDeload&&!wd.isTest&&ex.sugg==='up'&&<div className="alrt ok">{'\uD83D\uDCAA'} All sets hit! Next week +10 lbs</div>}
          <div className="wbox">
            <div className="wlbl">{ex.test&&ex.backoffW ? 'AMRAP Weight (95%)' : 'Working Weight'}</div>
            <div className="wval">{ex.cw}{typeof ex.cw==='number'?' LBS':''}</div>
            {typeof ex.cw==='number'&&(
              <div className="wadj">
                <button className="wb" onClick={()=>adjW(-10)}>-10</button>
                <button className="wb" onClick={()=>adjW(-5)}>-5</button>
                <button className="wb" onClick={()=>adjW(5)}>+5</button>
                <button className="wb" onClick={()=>adjW(10)}>+10</button>
              </div>
            )}
            {typeof ex.cw==='number'&&typeof ex.bar==='number'&&(
              <div className="pbox">
                <div className="plbl">Load Per Side</div>
                <div className="pval">
                  {ex.name === "Standing Calf Raise" ? `${ex.cw} lbs total` : calcPlatesForExercise(ex.name, ex.cw, ex.bar)}
                </div>
              </div>
            )}
          </div>
          {ex.test&&ex.backoffW ? (
            <>
              <div className="slbl">Set 1 &middot; AMRAP (to technical failure)</div>
              <div className="sgrid" style={{gridTemplateColumns:'1fr'}}>
                <div className={`sbox${ex.sets[0]!==null?(ex.sets[0]>=1?' hit':' miss'):''}`}>
                  <div className="sn">Set 1 &mdash; AMRAP</div>
                  <input className="sinput" type="number" inputMode="numeric" value={ex.sets[0]??''} placeholder="–" onChange={e=>updSet(0,e.target.value)}/>
                </div>
              </div>
              <div className="wbox" style={{marginTop:14}}>
                <div className="wlbl">Back-off Weight (85%)</div>
                <div className="wval">{ex.backoffW} LBS</div>
                {typeof ex.bar==='number'&&(
                  <div className="pbox">
                    <div className="plbl">Load Per Side</div>
                    <div className="pval">
                      {ex.name === "Standing Calf Raise" ? `${ex.backoffW} lbs total` : calcPlatesForExercise(ex.name, ex.backoffW, ex.bar)}
                    </div>
                  </div>
                )}
              </div>
              <div className="slbl">Set 2 &middot; Target: {ex.backoffReps} reps</div>
              <div className="sgrid" style={{gridTemplateColumns:'1fr'}}>
                <div className={`sbox${ex.sets[1]!==null?(ex.sets[1]>=ex.backoffReps?' hit':' miss'):''}`}>
                  <div className="sn">Set 2 &mdash; Back-off</div>
                  <input className="sinput" type="number" inputMode="numeric" value={ex.sets[1]??''} placeholder="–" onChange={e=>updSet(1,e.target.value)}/>
                </div>
              </div>
            </>
          ) : (
            <>
              <div className="slbl">Log Sets &middot; Target: {ex.reps} reps</div>
              <div className="sgrid">
                {ex.sets.map((r,si)=>{
                  const hit = r !== null && r >= tgtMin && r <= tgtMax;
                  const miss = r !== null && (r < tgtMin || r > tgtMax);
                  return(
                    <div key={si} className={`sbox${hit?' hit':miss?' miss':''}`}>
                      <div className="sn">Set {si+1}</div>
                      <input className="sinput" type="number" inputMode="numeric" value={r??''} placeholder="–" onChange={e=>updSet(si,e.target.value)}/>
                    </div>
                  );
                })}
              </div>
            </>
          )}
          <div className="tcard">
            <div className={`tdisp${ticking?' tick':''}${timerDisplay<0?' neg':''}`}>{fmt(timerDisplay)}</div>
            <div className="tpre">
              {[2,3,5].map(m=><button key={m} className={`tpb${preset===m?' on':''}`} onClick={()=>setPre(m)}>{m} MIN</button>)}
            </div>
            <div className="tctrls">
              <button className="tb" onClick={()=>ticking?pauseTimer():startTimer(preset*60)}>{ticking?'Pause':'Start'}</button>
              <button className="tb" onClick={resetTimer}>Reset</button>
            </div>
          </div>
          <div className="wlbl" style={{margin:'14px 0 8px'}}>Notes</div>
          <textarea className="ntxt" placeholder="Form notes, weight changes..." value={ex.notes} onChange={e=>updNotes(e.target.value)}/>
        </div>
      </div>
      {/* Toast */}
      {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}
      {/* Abandon confirm */}
      <div className={`modal${modal==='quit'?' open':''}`}>
        <div className="mbox">
          <div className="mt">Quit Workout?</div>
          <p style={{textAlign:'center',color:'var(--dim)',marginBottom:20,fontSize:14}}>This workout will NOT be saved. All logged sets will be lost.</p>
          <button className="btn bdn" onClick={abandon}>Yes, Discard Workout</button>
          <button className="btn bsc" onClick={()=>setModal(null)}>Keep Going</button>
        </div>
      </div>
      <div className="navb">
        <button className="nb dng" onClick={()=>setModal('quit')}>{'\u2715'} Quit</button>
        <button className="nb" onClick={()=>{
          if(ei>0) {
            const newEi = ei-1;
            setEi(newEi);
            const newEx = workout.ex[newEi];
            const newPreset = newEx.prim ? 5 : 2;
            setPreset(newPreset);
            resetTimer();
          }
        }} disabled={ei===0}>{'\u2190'} Prev</button>
        <button className="nb" onClick={()=>{
          if(ei<workout.ex.length-1) {
            const newEi = ei+1;
            setEi(newEi);
            const newEx = workout.ex[newEi];
            const newPreset = newEx.prim ? 5 : 2;
            setPreset(newPreset);
            resetTimer();
          }
        }} disabled={ei===workout.ex.length-1}>Next {'\u2192'}</button>
        <button className="nb pr" onClick={()=>setModal('save')}>{'\u2713'} Finish</button>
      </div>
    </div>
  );
}
// React 18 createRoot
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
